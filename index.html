<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RO-PACE</title>
<style>
:root{--navy:#1f3864;--orange:#f37022;--bg:#f3f5f9;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e3e7ee;
--green:#2e7d32;--amber:#b26a00;--red:#c00000;--blue:#2f75b5;--grey:#9aa3af;--purple:#7030a0}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
a{color:var(--blue)}
header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header .t{font-weight:bold;font-size:17px;flex:1}
header .t small{font-weight:normal;opacity:.8;font-size:12px;display:block}
header button{background:transparent;border:1px solid #ffffff66;color:#fff;padding:6px 10px;border-radius:6px;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:12px 16px 60px}
.card{background:var(--card);border-radius:10px;box-shadow:0 1px 3px #0001;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:4px 0 10px}h3{font-size:15px;margin:14px 0 8px;color:var(--navy)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--card);border-radius:10px;padding:12px;box-shadow:0 1px 3px #0001}
.kpi .v{font-size:22px;font-weight:bold}.kpi .l{font-size:12px;color:var(--mute);margin-top:2px}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:bold;color:#fff;white-space:nowrap}
.Green,.green{background:var(--green)}.Amber,.amber{background:var(--amber)}.Red,.red{background:var(--red)}.blue{background:var(--blue)}.grey{background:var(--grey)}
.bar{height:8px;background:#e8ebf1;border-radius:6px;overflow:hidden;position:relative;margin:3px 0}
.bar i{display:block;height:100%}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:6px 0 12px;border-bottom:2px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 12px;font-size:14px;color:var(--mute);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--navy);border-color:var(--orange);font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--navy);color:#fff;text-align:left;padding:7px;font-weight:normal}
td{padding:7px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.btn{background:var(--orange);color:#fff;border:0;padding:9px 14px;border-radius:6px;font-size:14px;cursor:pointer}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.small{padding:5px 9px;font-size:12px}
.btn.wa{background:#1fa855}
.btn:disabled{opacity:.5}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid #c7ccd6;border-radius:6px;font-size:15px;font-family:inherit;background:#fff}
textarea{min-height:70px}
.muted{color:var(--mute);font-size:12px}
.site{cursor:pointer}
.site .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.site .name{font-weight:bold}
.job{display:flex;gap:8px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.job .c{width:38px;font-weight:bold;color:var(--navy)}
.job .d{flex:1}
.job .s{text-align:right;min-width:110px}
.area{background:#eef1f7;padding:6px 8px;font-weight:bold;color:var(--navy);border-radius:6px;margin-top:10px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:14px}}
.err{color:var(--red);margin-top:8px;font-size:14px}
.ok{color:var(--green)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;z-index:30;font-size:14px;max-width:90%}
.loading{position:fixed;top:0;left:0;right:0;height:3px;background:var(--orange);z-index:40;animation:ld 1s infinite}
@keyframes ld{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photos .p{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px #0002;font-size:12px}
.photos img{width:100%;height:120px;object-fit:cover;display:block;background:#ddd}
.photos .p div{padding:6px}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:12px}
.legend i{width:14px;height:8px;display:inline-block;border-radius:2px}
.login{max-width:380px;margin:40px auto}
.pre{white-space:pre-wrap;background:#f6f7f9;border:1px solid var(--line);padding:10px;border-radius:6px;font-size:13px;max-height:300px;overflow:auto}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ helpers ============ */
var ST={token:null,user:null,boot:null,site:null,tab:'summary',siteId:null};
try{ ST.token=localStorage.getItem('ropace_token'); }catch(e){}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dshow(s){ if(!s) return '-'; var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return esc(s); return m[3]+'-'+MON[+m[2]-1]+'-'+m[1].slice(2); }
function dnum(s){ var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?Math.round(Date.UTC(+m[1],m[2]-1,+m[3])/864e5):null; }
function money(n){ n=Math.round(+n||0); return 'Rs. '+n.toLocaleString('en-IN'); }
function toast(t){ var d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(function(){ d.remove(); },3500); }
var busy=0; function load(on){ busy+=on?1:-1; var l=document.querySelector('.loading'); if(busy>0&&!l){ l=document.createElement('div'); l.className='loading'; document.body.appendChild(l);} if(busy<=0&&l) l.remove(); }
/* If this page is opened from an outside web address (not from script.google.com),
   paste the RO-PACE web app link (ending in /exec) between the quotes below. */
var API_URL='https://script.google.com/macros/s/AKfycbx-UFpRH23UioWkKtBd8E2yk5SC-qYWw5Zs_Clea_UZcC0lf8ig4Y8zqBNbh9udqgsmeA/exec';
function hasGs(){ try{ return !!(window.google&&google.script&&google.script.run); }catch(e){ return false; } }
function api(fn){
  var args=Array.prototype.slice.call(arguments,1);
  load(true);
  function fail(m,rej){
    load(false);
    if(String(m).indexOf('SESSION_EXPIRED')>=0){ logout(true); rej(new Error('Please log in again.')); return; }
    rej(new Error(m));
  }
  return new Promise(function(res,rej){
    if(hasGs()){
      google.script.run.withSuccessHandler(function(r){ load(false); res(r); })
        .withFailureHandler(function(e){ fail((e&&e.message)||String(e),rej); })[fn].apply(null,args);
      return;
    }
    if(API_URL.indexOf('https://')!==0){ fail('Web app link not set in this page (API_URL).',rej); return; }
    fetch(API_URL,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
      .then(function(r){ return r.json(); })
      .then(function(x){ if(x.ok){ load(false); res(x.r); } else fail(x.error||x.e||'Error',rej); })
      .catch(function(){ fail('Cannot reach RO-PACE. Check internet connection.',rej); });
  });
}
function role(){ return ST.user?ST.user.role:''; }
function can(what){
  var r=role();
  if(what==='update') return r==='ADMIN'||r==='OFFICER'||r==='TPI';
  if(what==='approve'||what==='admin') return r==='ADMIN';
  if(what==='officer') return r==='ADMIN'||r==='OFFICER';
  if(what==='addsite') return r==='ADMIN'||r==='OFFICER'||r==='TPI';
  return false;
}
function modal(html){ closeModal(); var m=document.createElement('div'); m.className='modal'; m.id='modal'; m.innerHTML='<div class="box">'+html+'</div>';
  m.onclick=function(e){ if(e.target===m) closeModal(); }; document.body.appendChild(m); }
function closeModal(){ var m=$('modal'); if(m) m.remove(); }
function showErr(id,e){ var el=$(id); if(el) el.textContent=e.message||e; else toast(e.message||e); }

/* ============ login ============ */
function viewLogin(msg){
  $('app').innerHTML='<header><div class="t">RO-PACE<small>Site RO Work Monitoring</small></div></header>'+
  '<main><div class="card login"><h2>Log in</h2>'+
  '<label>E-mail</label><input id="em" type="email" autocomplete="username">'+
  '<label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password">'+
  '<div style="margin-top:14px"><button class="btn" id="lb" onclick="doLogin()" style="width:100%">Log in</button></div>'+
  '<div id="le" class="err">'+esc(msg||'')+'</div><p class="muted">Forgot PIN? Ask your RO-PACE admin to reset it.</p></div></main>';
  $('pin').onkeydown=function(e){ if(e.key==='Enter') doLogin(); };
}
function doLogin(){
  api('apiLogin',$('em').value,$('pin').value).then(function(r){
    ST.token=r.token; ST.user=r.user; try{ localStorage.setItem('ropace_token',r.token); }catch(e){}
    home();
  }).catch(function(e){ showErr('le',e); });
}
function logout(expired){
  if(ST.token && !expired){ try{ api('apiLogout',ST.token).catch(function(){}); }catch(e){} }
  ST.token=null; ST.user=null; try{ localStorage.removeItem('ropace_token'); }catch(e){}
  viewLogin(expired?'Session ended. Please log in again.':'');
}
function shell(title, sub, body, back){
  $('app').innerHTML='<header>'+(back?'<button onclick="'+back+'">&larr;</button>':'')+
   '<div class="t">'+esc(title)+'<small>'+esc(sub||'')+'</small></div>'+
   '<button onclick="logout()">Log out</button></header><main>'+body+'</main>';
}

/* ============ home: all sites ============ */
function home(){
  ST.siteId=null;
  api('apiBoot',ST.token).then(function(b){ ST.boot=b; ST.user=b.user; renderHome(); }).catch(function(e){ toast(e.message); });
}
function renderHome(){
  var b=ST.boot, s=b.sites.slice(), filt=ST.homeFilter||'Active';
  var shown=s.filter(function(x){ return filt==='All'||x.status===filt; });
  shown.sort(function(a,b){ return (b.sm.slip-a.sm.slip)||(b.sm.lateCount-a.sm.lateCount); });
  var cnt={Green:0,Amber:0,Red:0}, pend=0;
  s.filter(function(x){ return x.status==='Active'; }).forEach(function(x){ cnt[x.sm.health]++; pend+=x.sm.pendingHindrances; });
  var h='<div class="kpis">'+
    kpi(s.filter(function(x){return x.status==='Active';}).length,'Active sites')+
    kpi('<span style="color:var(--red)">'+cnt.Red+'</span>','Sites in RED (serious delay)')+
    kpi('<span style="color:var(--amber)">'+cnt.Amber+'</span>','Sites in AMBER (some delay)')+
    kpi('<span style="color:var(--green)">'+cnt.Green+'</span>','Sites on time')+
    (can('approve')?kpi(pend,'Hindrances waiting for approval'):'')+(can('officer')?kpi('<span style="color:var(--amber)">'+s.filter(function(x){return x.status==='Pending Approval';}).length+'</span>','Sites waiting for your approval'):'')+'</div>';
  h+='<div class="row" style="margin:12px 0;align-items:center"><div><select onchange="ST.homeFilter=this.value;renderHome()">'+
     ['Active','Pending Approval','Rejected','Completed','On hold','All'].map(function(o){ return '<option'+(o===filt?' selected':'')+'>'+o+'</option>'; }).join('')+'</select></div>'+
     '<div style="text-align:right;flex:2">'+(can('addsite')?'<button class="btn" onclick="editSite(null)">+ New site</button> ':'')+(can('admin')?'<button class="btn sec" onclick="usersView()">Users</button>':'')+'</div></div>';
  if(!shown.length) h+='<div class="card muted">No sites to show.'+(can('addsite')?' Click "+ New site" to add one.':'')+'</div>';
  shown.forEach(function(x){
    var sm=x.sm;
    var verBadge=(x.planName&&x.planName!=='A')?'<div style="margin-top:4px"><span class="chip blue">Running Plan '+esc(x.planName)+'</span></div>':'';
    var planBadge=(x.planPending&&can('officer'))?'<div style="margin-top:4px"><span class="chip amber">'+x.planPending+' revised plan waiting for approval</span></div>':(x.planPending?'<div style="margin-top:4px"><span class="chip amber">Revised plan sent for approval</span></div>':'');
    var stBadge=verBadge+planBadge+(x.status==='Pending Approval'?'<div style="margin-top:4px"><span class="chip amber">Waiting for IOCL approval</span> <span class="muted">added by '+esc(x.createdBy||'-')+'</span></div>':x.status==='Rejected'?'<div style="margin-top:4px"><span class="chip red">Rejected</span></div>':'');
    var stBtn=(x.status==='Pending Approval'&&can('officer'))?'<div style="margin-top:8px" onclick="event.stopPropagation()"><button class="btn small" onclick="reviewSite(\''+esc(x.id)+'\',\'approve\')">Accept site</button> <button class="btn small sec" onclick="reviewSite(\''+esc(x.id)+'\',\'reject\')">Reject</button></div>':'';
    h+='<div class="card site" onclick="openSite(\''+esc(x.id)+'\')"><div class="top"><div><div class="name">'+esc(x.roName)+'</div>'+stBadge+stBtn+
       '<div class="muted">'+esc(x.id)+' · '+esc(x.contractor||'-')+' · '+esc(x.location||'')+'</div></div><span class="chip '+sm.health+'">'+sm.health+'</span></div>'+
       '<div class="row" style="margin-top:8px"><div><div class="muted">Planned '+sm.plannedPct+'%</div><div class="bar"><i class="blue" style="width:'+sm.plannedPct+'%"></i></div>'+
       '<div class="muted">Actual '+sm.actualPct+'%</div><div class="bar"><i class="'+(sm.gap>5?'red':'green')+'" style="width:'+sm.actualPct+'%"></i></div></div>'+
       '<div class="muted" style="line-height:1.7">Day <b>'+(sm.dayNo||'-')+'</b> · Late jobs <b>'+sm.lateCount+'</b><br>Days behind <b>'+sm.slip+'</b> · Expected finish <b>'+dshow(sm.forecastFinish)+'</b><br>Last date (incl. extension) <b>'+dshow(sm.newEnd)+'</b>'+
       (x.locked!=='YES'?'<br><span style="color:var(--amber)">Plan not yet approved / locked</span>':'')+(x.openDefects?'<br><span style="color:var(--red)"><b>'+x.openDefects+'</b> defect(s) to rectify'+(x.overdueDefects?' ('+x.overdueDefects+' overdue)':'')+'</span>':'')+(x.verifyDefects?'<br><span style="color:var(--blue)">'+x.verifyDefects+' rectified - to verify</span>':'')+'</div></div></div>';
  });
  shell('RO-PACE','Hello '+(ST.user.name||ST.user.email)+' ('+ST.user.role+')',h);
}
function kpi(v,l){ return '<div class="kpi"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'; }

/* ============ one site ============ */
function openSite(id){ ST.siteId=id; ST.tab=ST.tab||'summary'; api('apiSite',ST.token,id).then(function(d){ ST.site=d; renderSite(); }).catch(function(e){ toast(e.message); }); }
function refreshSite(d){ ST.site=d; renderSite(); }
var TABS=[['summary','Summary'],['work','Work list'],['chart','Bar chart'],['hind','Hindrances'],['defects','Defects'],['photos','Photos'],['history','History'],['plan','Plan'],['admin','Site settings']];
function renderSite(){
  var d=ST.site, s=d.site;
  var banner=s['Status']==='Pending Approval'?'<div class="card" style="border-left:5px solid var(--amber)"><b>This site is waiting for IOCL approval.</b> (added by '+esc(s['Created By']||'-')+')'+(can('officer')?'<div style="margin-top:8px"><button class="btn small" onclick="reviewSite(\''+esc(s['Site ID'])+'\',\'approve\')">Accept site</button> <button class="btn small sec" onclick="reviewSite(\''+esc(s['Site ID'])+'\',\'reject\')">Reject</button></div>':'<div class="muted">Updates can start after an IOCL officer accepts it.</div>')+'</div>':s['Status']==='Rejected'?'<div class="card" style="border-left:5px solid var(--red)"><b>This site was rejected.</b> See the History tab for the reason.</div>':'';
  banner+=planBanner(d);
  var tabs='<div class="tabs">'+TABS.filter(function(t){ return t[0]==='admin'?can('officer'):true; }).map(function(t){ return '<button class="'+(ST.tab===t[0]?'on':'')+'" onclick="ST.tab=\''+t[0]+'\';renderSite()">'+t[1]+'</button>'; }).join('')+'</div>';
  var body={summary:tSummary,work:tWork,chart:tChart,hind:tHind,defects:tDefects,photos:tPhotos,history:tHistory,plan:tPlan,admin:tAdmin}[ST.tab]||tSummary;
  shell(s['RO Name'], s['Site ID']+' · '+(s['Contractor Name']||''), banner+tabs+body(d), 'home()');
}
function tSummary(d){
  var sm=d.sm, s=d.site;
  var h='<div class="kpis">'+kpi((sm.dayNo||'-')+'<span class="muted"> / '+(s['Contract Days']||105)+'</span>','Day no. today')+
    kpi(sm.plannedPct+'%','Planned progress')+kpi('<span style="color:'+(sm.gap>5?'var(--red)':'var(--green)')+'">'+sm.actualPct+'%</span>','Actual progress')+
    kpi('<span style="color:'+(sm.slip>0?'var(--red)':'var(--green)')+'">'+sm.slip+'</span>','Days behind plan')+
    kpi(dshow(sm.forecastFinish),'Expected finish')+kpi(dshow(sm.newEnd),'Last date (incl. '+(s['Approved Extra Days']||0)+' days extension)')+'</div>';
  if(sm.beyondEnd>0) h+='<div class="card" style="border-left:5px solid var(--red)"><b style="color:var(--red)">Expected to finish '+sm.beyondEnd+' days after the last date.</b><br>'+
    'Price discount (0.5% per week): <b>'+sm.discount.pct+'%</b> = <b>'+money(sm.discount.amount)+'</b> on work done value '+money(s['Work Done Value'])+'<br>TPI cost recovery: <b>'+money(sm.tpiRecovery)+'</b><div class="muted">Estimate only. Final figure as per approved hindrances & contract.</div></div>';
  h+='<div class="card"><div class="row" style="align-items:center"><h3 style="margin:0">Late work ('+sm.late.length+')</h3><div style="text-align:right;flex:2">'+
     '<button class="btn wa small" onclick="waOpen()">WhatsApp message</button> <button class="btn sec small" onclick="waCopy()">Copy text</button> '+
     (can('officer')?'<button class="btn sec small" onclick="previewAlert()">Preview e-mail</button> <button class="btn small" onclick="sendAlert()">Send reminder now</button>':'')+'</div></div>';
  if(!sm.late.length) h+='<p class="ok">No work is late. Good progress.</p>';
  else h+='<div class="scroll"><table><tr><th>No.</th><th>Work</th><th>Days late</th><th>Delays whole project?</th><th>Status</th></tr>'+
    sm.late.map(function(j){ return '<tr><td><b>'+esc(j.code)+'</b></td><td>'+esc(j.description)+'</td><td><b style="color:'+(j.impact>0?'var(--red)':'var(--amber)')+'">'+j.delay+'</b></td><td>'+(j.impact>0?'<b style="color:var(--red)">YES</b>':'No')+'</td><td>'+esc(j.status)+'</td></tr>'; }).join('')+'</table></div>';
  h+='</div>';
  if(sm.externalLate.length) h+='<div class="card"><h3 style="margin-top:0">Pending from IOCL / LOI Holder (not contractor\'s delay)</h3>'+sm.externalLate.map(function(j){ return '<div>'+esc(j.code)+' - '+esc(j.description)+': <b>'+j.delay+' days late</b></div>'; }).join('')+'</div>';
  h+=defCard(d);
  h+='<div class="card"><h3 style="margin-top:0">Hindrances</h3>Approved hindrance days (overlaps counted once): <b>'+sm.hindranceDays+'</b> · Waiting for approval: <b>'+sm.pendingHindrances+'</b>'+
     '<div class="muted">Admin decides the time extension after checking these.</div></div>';
  if(String(s['Plan Locked']).toUpperCase()!=='YES') h+='<div class="card" style="border-left:5px solid var(--amber)">This plan is <b>not yet approved / locked</b>. Reminders start only after admin locks the plan (Site settings tab).</div>';
  return h;
}
function waOpen(){ window.open('https://wa.me/?text='+encodeURIComponent(ST.site.wa),'_blank'); }
function waCopy(){ var t=ST.site.wa; if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ toast('Copied. Paste in WhatsApp group.'); },function(){ modal('<div class="pre">'+esc(t)+'</div>'); }); else modal('<div class="pre">'+esc(t)+'</div>'); }
function previewAlert(){
  api('apiPreviewAlert',ST.token,ST.siteId).then(function(p){
    if(!p.contractor){ toast('No late work - no reminder needed.'); return; }
    modal('<h2>Reminder e-mail (preview)</h2><div class="muted">To: '+esc(p.contractor.to.join(', '))+'<br>Copy: '+esc(p.contractor.cc.join(', '))+'</div><p><b>'+esc(p.contractor.subject)+'</b></p><div class="pre" style="white-space:normal">'+p.contractor.html+'</div>'+
      (p.draft?'<h3>Show-cause draft (goes only to Engineer-in-Charge & admins)</h3><div class="pre" style="white-space:normal">'+p.draft.html+'</div>':'')+
      '<div style="margin-top:12px"><button class="btn sec" onclick="closeModal()">Close</button></div>');
  }).catch(function(e){ toast(e.message); });
}
function sendAlert(){ if(!confirm('Send reminder e-mail to the contractor now?')) return; api('apiSendAlert',ST.token,ST.siteId).then(function(m){ toast(m); }).catch(function(e){ toast(e.message); }); }

/* ---- work list ---- */
function tWork(d){
  var h='<div class="card"><div class="muted">Tap a work to '+(can('update')?'update progress, dates, reason for delay & photos.':'see details.')+'</div>';
  var area=null;
  d.jobs.forEach(function(j,i){
    if(j.area!==area){ area=j.area; h+='<div class="area">'+esc(area)+'</div>'; }
    var st=j.st;

/* ---- defects (defective work) ---- */
function canRect(){ var r=role(); return r==='ADMIN'||r==='OFFICER'||r==='TPI'||r==='CONTRACTOR'; }
var DSTAT={Open:'red',Rectified:'blue',Closed:'green',Cancelled:'grey'};
function defCard(d){
  var ds=d.defects||[]; if(!ds.length) return '';
  var open=ds.filter(function(x){ return x.status==='Open'; }), od=open.filter(function(x){ return x.overdue>0; }), pv=ds.filter(function(x){ return x.status==='Rectified'; });
  return '<div class="card" style="border-left:5px solid '+(open.length?'var(--red)':'var(--green)')+'"><h3 style="margin-top:0">Defective work</h3>Pending rectification: <b style="color:var(--red)">'+open.length+'</b> · Overdue: <b>'+od.length+'</b> · Rectified, to verify: <b>'+pv.length+'</b> '+
    '<button class="btn sec small" style="margin-left:8px" onclick="ST.tab=\'defects\';renderSite()">Open</button></div>';
}
function tDefects(d){
  var ds=(d.defects||[]).slice(), ord={Open:0,Rectified:1,Closed:2,Cancelled:3};
  ds.sort(function(a,b){ return (ord[a.status]-ord[b.status])||(b.overdue-a.overdue); });
  var cnt=function(s){ return ds.filter(function(x){ return x.status===s; }).length; }, od=ds.filter(function(x){ return x.overdue>0; }).length;
  var h='<div class="card"><h3 style="margin-top:0">Defective work</h3><div class="muted">Record any defective or non-conforming work. The contractor is reminded every working day until the rectification is recorded here, and the TPI / officer then verifies and closes it.</div>'+
   '<div class="kpis" style="margin-top:10px">'+kpi('<span style="color:var(--red)">'+cnt('Open')+'</span>','Pending rectification')+kpi(od,'Overdue')+kpi(cnt('Rectified'),'Rectified - to verify')+kpi(cnt('Closed'),'Closed')+'</div>'+
   '<div class="row" style="margin-top:10px">'+(can('update')?'<button class="btn" onclick="addDefect()">+ Record defect</button>':'')+(can('officer')?'<button class="btn sec" onclick="sendDefRem()">Send reminder now</button>':'')+'</div></div>';
  if(!ds.length) return h+'<div class="card muted">No defect recorded for this site.</div>';
  ds.forEach(function(x){
    var i=esc(x.id), btn='';
    if(x.status==='Open'&&canRect()) btn+='<button class="btn small" onclick="rectDefect(\''+i+'\')">Mark as rectified</button> ';
    if(x.status==='Rectified'&&can('update')) btn+='<button class="btn small" onclick="verDefect(\''+i+'\')">Verify / send back</button> ';
    if((x.status==='Open'||x.status==='Rectified')&&can('approve')) btn+='<button class="btn small sec" onclick="cancelDefect(\''+i+'\')">Cancel entry</button>';
    h+='<div class="card"><div class="row"><div><b>'+(x.code?esc(x.code)+' · ':'')+esc(x.severity)+'</b> · '+esc(x.category||'-')+'</div><div style="text-align:right"><span class="chip '+(DSTAT[x.status]||'grey')+'">'+(x.status==='Open'?'Rectification pending':esc(x.status))+'</span>'+(x.overdue>0?' <span class="chip red">'+x.overdue+' days overdue</span>':'')+'</div></div>'+
     '<div style="margin-top:6px">'+esc(x.defect)+'</div>'+(x.details?'<div class="muted">'+esc(x.details)+'</div>':'')+
     '<div class="muted">Recorded by '+esc(x.raisedBy)+' on '+esc(x.raisedAt)+' · Rectify by <b>'+dshow(x.due)+'</b>'+(x.reworkDays?' · Time lost about '+x.reworkDays+' days':'')+' · Reminders sent: '+x.reminders+(x.photo?' · <a href="'+esc(x.photo)+'" target="_blank">Photo</a>':'')+'</div>'+
     (x.rectifiedOn?'<div class="muted">Rectified on '+dshow(x.rectifiedOn)+' by '+esc(x.rectifiedBy)+': '+esc(x.rectRemark)+'</div>':'')+
     (x.verifiedBy?'<div class="muted">Checked by '+esc(x.verifiedBy)+' on '+esc(x.verifiedAt)+(x.verifyRemark?' - '+esc(x.verifyRemark):'')+'</div>':'')+
     (btn?'<div style="margin-top:8px">'+btn+'</div>':'')+'</div>';
  });
  return h;
}

/* ---- bar chart ---- */
function tChart(d){
  var s=d.site, start=dnum(s['Start Date']), jobs=d.jobs, today=dnum(ST.boot.today);
  var maxD=Math.max(+s['Contract Days']||105, (dnum(d.sm.forecastFinish)||0)-start+1, today-start+1)+3;
  jobs.forEach(function(j){ var a=dnum(j.actualFinish); if(a) maxD=Math.max(maxD,a-start+4); });
  var W=7, L=(window.innerWidth<600?150:230), rowH=22, H=40+jobs.length*rowH, Wt=L+maxD*W+10;
  var x=function(n){ return L+(n-start)*W; };
  var svg='<svg width="'+Wt+'" height="'+H+'" style="font-family:Arial;font-size:11px">';
  for(var w=0; w*7<maxD; w++){ svg+='<rect x="'+(L+w*7*W)+'" y="0" width="'+(7*W)+'" height="'+H+'" fill="'+(w%2?'#f7f8fb':'#fff')+'"/><text x="'+(L+w*7*W+2)+'" y="14" fill="#667085">W'+(w+1)+'</text>'; }
  var ce=dnum(s['Contract End']), ne=dnum(s['New End Date']);
  if(ce) svg+='<line x1="'+(x(ce)+W)+'" x2="'+(x(ce)+W)+'" y1="20" y2="'+H+'" stroke="#f37022" stroke-width="2"/><text x="'+(x(ce)+W+2)+'" y="30" fill="#f37022">Contract end</text>';
  if(ne&&ne!==ce) svg+='<line x1="'+(x(ne)+W)+'" x2="'+(x(ne)+W)+'" y1="20" y2="'+H+'" stroke="#7030a0" stroke-dasharray="4"/>';
  jobs.forEach(function(j,i){
    var y=36+i*rowH, ps=dnum(j.planStart), pf=dnum(j.planFinish), st=j.st;
    svg+='<text x="4" y="'+(y+12)+'" fill="#1d2433">'+esc(j.code)+' '+esc(String(j.description).slice(0,(window.innerWidth<600?20:32)))+'</text>';
    if(st.external){ svg+='<rect x="'+(x(pf)+1)+'" y="'+(y+3)+'" width="10" height="10" transform="rotate(45 '+(x(pf)+6)+' '+(y+8)+')" fill="'+(j.actualFinish?'#2e7d32':'#7030a0')+'"/>'; return; }
    if(+j.days===0) return;
    svg+='<rect x="'+x(ps)+'" y="'+(y+2)+'" width="'+((pf-ps+1)*W)+'" height="7" fill="#9dc3e6" rx="2"/>';
    var as=dnum(j.actualStart);
    if(as){ var ae=dnum(j.actualFinish)||today; var col=st.delay>0?(st.impact>0?'#c00000':'#b26a00'):'#2e7d32';
      svg+='<rect x="'+x(as)+'" y="'+(y+10)+'" width="'+(Math.max(1,ae-as+1)*W)+'" height="7" fill="'+col+'" rx="2"/>'; }
    else if(st.delay>0){ svg+='<text x="'+(x(ps))+'" y="'+(y+18)+'" fill="#c00000" font-size="9">not started</text>'; }
  });
  if(today>=start) svg+='<line x1="'+(x(today)+W/2)+'" x2="'+(x(today)+W/2)+'" y1="20" y2="'+H+'" stroke="#e1b000" stroke-width="2"/><text x="'+(x(today)+4)+'" y="'+(H-4)+'" fill="#a07c00">Today</text>';
  svg+='</svg>';
  return '<div class="card"><div class="legend"><span><i style="background:#9dc3e6"></i>Planned</span><span><i style="background:#2e7d32"></i>Actual - on time</span><span><i style="background:#b26a00"></i>Actual - late (has spare days)</span><span><i style="background:#c00000"></i>Actual - late, delays project</span><span><i style="background:#7030a0"></i>IOCL / LOI Holder item</span><span><i style="background:#e1b000"></i>Today</span></div>'+
   '<div class="scroll" style="margin-top:8px">'+svg+'</div></div>';
}

var FIELDS=[['RO Name','text'],['Location','text'],['Divisional Office','text'],['Tender No','text'],['Vendor Code','text'],['Contractor Name','text'],
 ['Contractor Email','email'],['Contractor WhatsApp','tel'],['PO No','text'],['PO Amount','number'],['PO Date','date'],['Handover Date','date'],
 ['Start Date Override','date'],['Contract Days','number'],['Engineer-in-Charge Email','email'],['TPI Email','text'],['Officer Emails','text'],['Work Done Value','number']];
var HINTS={'PO Date':'PO / commencement order date. Start date = this + 10 days','Handover Date':'Fill only if site was handed over earlier','Start Date Override':'Fill only if Engineer-in-Charge fixes a different start date',
 'TPI Email':'More than one: separate by comma','Officer Emails':'SREH, SRH etc. - get copy of serious reminders','Work Done Value':'Value of work done till last RA bill (for price discount estimate)'};
var STD=['Site ID','RO Name','Location','Divisional Office','Tender No','Vendor Code','Contractor Name','Contractor Email','Contractor WhatsApp','PO No','PO Amount','PO Date','Handover Date','Start Date','Contract Days','Contract End','Approved Extra Days','New End Date','Plan Finish','Engineer-in-Charge Email','TPI Email','Officer Emails','Work Done Value','Status','Plan Locked','Plan Target Days','Created By','Created At'];
function siteForm(s){
  s=s||{};
  var extra=(ST.boot.siteFields||[]).filter(function(f){ return STD.indexOf(f)<0; });
  return FIELDS.concat(extra.map(function(f){ return [f,'text']; })).map(function(f){
    var val=f[0]==='Start Date Override'?'':(s[f[0]]===undefined?'':s[f[0]]);
    if(f[0]==='Contract Days'&&val==='') val=(ST.boot.settings&&ST.boot.settings.contractDays)||105;
    return '<label>'+esc(f[0])+(HINTS[f[0]]?' <span class="muted">- '+esc(HINTS[f[0]])+'</span>':'')+'</label><input data-f="'+esc(f[0])+'" type="'+f[1]+'" value="'+esc(val)+'">'; }).join('');
}
function readForm(box){ var o={}; box.querySelectorAll('[data-f]').forEach(function(i){ o[i.getAttribute('data-f')]=i.value; }); return o; }
function editSite(s){
  modal('<h2>'+(s?'Edit site details':'New site')+'</h2><div id="sf">'+siteForm(s)+'</div><div id="se" class="err"></div>'+
    '<div class="row" style="margin-top:12px"><button class="btn" onclick="saveSite('+(s?'\''+esc(s['Site ID'])+'\'':'null')+')">Save</button><button class="btn sec" onclick="closeModal()">Cancel</button></div>'+
    (s?'':'<p class="muted">The work list and planned dates are made automatically from the WORK TEMPLATE sheet. '+(role()==='TPI'?'This site will be sent to the IOCL officer for acceptance before work updates start.':'As you are an IOCL officer / admin, the site is approved automatically. Check the plan in "Site settings" and then lock it.')+'</p>'));
}

function reviewSite(id,action){
  modal('<h2>'+(action==='approve'?'Accept this site?':'Reject this site')+'</h2><label>Remark'+(action==='reject'?' (reason is required)':' (optional)')+'</label><textarea id="rsr" rows="3"></textarea><div id="rse" class="err"></div><div class="row" style="margin-top:12px"><button class="btn" id="rsb">'+(action==='approve'?'Accept site':'Reject site')+'</button><button class="btn sec" onclick="closeModal()">Cancel</button></div>');
  $('rsb').onclick=function(){ api('apiReviewSite',ST.token,id,action,$('rsr').value).then(function(){ closeModal(); toast(action==='approve'?'Site accepted':'Site rejected'); if(ST.siteId===id) openSite(id); else home(); }).catch(function(e){ showErr('rse',e); }); };
}
function saveSite(id){
  var o=readForm($('sf')); if(id) o['Site ID']=id;
  api('apiSaveSite',ST.token,o).then(function(newId){ closeModal(); toast('Saved'); ST.tab=id?'admin':'summary'; api('apiBoot',ST.token).then(function(b){ ST.boot=b; openSite(newId); }); }).catch(function(e){ showErr('se',e); });
}
function tAdmin(d){
  var s=d.site, locked=String(s['Plan Locked']).toUpperCase()==='YES';
  var h='<div class="card"><h3 style="margin-top:0">Site details</h3><div class="muted">Start: '+dshow(s['Start Date'])+' · Contract end: '+dshow(s['Contract End'])+' · Plan finish: '+dshow(s['Plan Finish'])+' · Status: '+esc(s['Status'])+'</div>';
  Object.keys(d.extra||{}).forEach(function(k){ h+='<div class="muted">'+esc(k)+': '+esc(d.extra[k])+'</div>'; });
  h+='<div style="margin-top:8px"><button class="btn sec" onclick="editSite(ST.site.site)">Edit details</button></div></div>';
  if(can('admin')){
    h+='<div class="card"><h3 style="margin-top:0">Time extension</h3><div class="muted">Approved hindrance days (overlaps counted once): <b>'+d.sm.hindranceDays+'</b>. Present extension: <b>'+(s['Approved Extra Days']||0)+' days</b>, last date <b>'+dshow(s['New End Date'])+'</b>.</div>'+
       '<div class="row"><div><label>Approved extra days</label><input id="xd" type="number" min="0" value="'+(s['Approved Extra Days']||0)+'"></div><div style="flex:2"><label>Approval reference / remark</label><input id="xr"></div></div><div id="xe" class="err"></div>'+
       '<div style="margin-top:10px"><button class="btn" onclick="saveExtra()">Save extension</button></div></div>';
    h+='<div class="card"><h3 style="margin-top:0">Site status</h3><div class="row">'+['Active','On hold','Completed'].map(function(x){ return '<button class="btn '+(s['Status']===x?'':'sec')+'" onclick="setStatus(\''+x+'\')">'+x+'</button>'; }).join('')+'</div><div class="muted">Reminders go only for Active sites.</div></div>';
  }
  return h;
}
function dd(a,b){ return Math.round((Date.parse(b)-Date.parse(a))/864e5); }
function planBanner(d){
  var vs=d.planVersions||[], act=vs.filter(function(v){ return v.status==='Active'; })[0], A=vs[0];
  if(!act||act.plan==='A') return '';
  var diff=dd(A.finish,act.finish), s=d.site;
  return '<div class="card" style="border-left:5px solid var(--blue)"><b>Running Plan '+esc(act.plan)+'</b> - finish '+dshow(act.finish)+'. Master Plan A finish was '+dshow(A.finish)+(diff>0?' (<b style="color:var(--red)">'+diff+' days later</b> than master)':diff<0?' ('+(-diff)+' days earlier)':'')+'. '+
    (act.beyond?'<b>Beyond the scheduled completion ('+dshow(s['Contract End'])+')</b> - contractor committed to '+dshow(act.committed)+'. ':'Within the scheduled completion ('+dshow(s['Contract End'])+'). ')+
    '<span class="muted">Delay against the master plan and contract still counts; work status below is against the running plan.</span></div>';
}
function tPlan(d){
  var s=d.site, locked=String(s['Plan Locked']).toUpperCase()==='YES', isTpi=role()==='TPI', isOff=can('officer'), isCon=role()==='CONTRACTOR';
  var vs=d.planVersions||[], act=vs.filter(function(v){ return v.status==='Active'; })[0];
  var lim={contract:+s['Contract Days']||105}; lim.min=lim.contract-7; var tg=+s['Plan Target Days']; lim.target=(tg>=lim.min&&tg<=lim.contract)?tg:lim.min;
  var h='', next=String.fromCharCode(65+Math.min(vs.length,25));
  var pend=(d.proposals||[]).filter(function(p){ return p.status==='Pending'; }), hist=(d.proposals||[]).filter(function(p){ return p.status!=='Pending'; });
  if(vs.length){
    h+='<div class="card"><h3 style="margin-top:0">Plan versions</h3><div class="muted">Plan A is the master plan. If a plan fails, a new plan (B, C ...) is made after discussion with the contractor and the contractor is informed at once. Delay is always measured against the master plan and the contract.</div>';
    vs.slice().reverse().forEach(function(v){
      var diff=vs[0]?dd(vs[0].finish,v.finish):0, isAct=v.status==='Active';
      var ackTxt=v.ack==='Acknowledged'?'<span style="color:var(--green)">Acknowledged by '+esc(v.ackBy)+' on '+esc(String(v.ackAt).slice(0,10))+(v.ackRemark?' - '+esc(v.ackRemark):'')+'</span>':
        (v.informed?'<span style="color:var(--amber)">Contractor informed ('+esc(String(v.informed).slice(0,16))+') - not yet acknowledged. The plan stands as prepared after discussion.</span>':'<span class="muted">Contractor not yet informed</span>');
      h+='<div style="border-top:1px solid #e3e7ee;padding:8px 0"><div class="row"><div><b>Plan '+esc(v.plan)+'</b> <span class="chip '+(isAct?'green':'grey')+'">'+(isAct?'Running':'Replaced')+'</span> <span class="chip '+(v.beyond?'red':'blue')+'">'+(v.beyond?'Beyond scheduled completion':'Within scheduled completion')+'</span></div>'+
        '<div class="muted" style="text-align:right">'+esc(String(v.at).slice(0,10))+' - '+esc(v.by)+'</div></div>'+
        '<div>Finish <b>'+dshow(v.finish)+'</b> ('+esc(v.planDays)+' days)'+(v.plan!=='A'?(diff>0?' - <b style="color:var(--red)">'+diff+' days later than master</b>':diff<0?' - '+(-diff)+' days earlier than master':' - same as master'):'')+(v.beyond?' - contractor committed to <b>'+dshow(v.committed)+'</b>':'')+'</div>'+
        '<div class="muted">'+esc(v.reason||'')+'</div><div style="margin-top:4px">'+ackTxt+'</div>'+
        (isAct&&v.ack!=='Acknowledged'&&(isCon||isOff)?'<div style="margin-top:6px"><button class="btn small" onclick="ackPlan(\''+esc(v.id)+'\')">'+(isCon?'Acknowledge this plan':'Record contractor acknowledgement')+'</button></div>':'')+
        (isAct&&isOff?'<div style="margin-top:6px"><button class="btn wa small" onclick="waPlan()">WhatsApp to contractor</button> <button class="btn sec small" onclick="waPlanCopy()">Copy text</button></div>':'')+'</div>';
    });
    h+='</div>';
    if(act&&act.plan!=='A'&&vs[0].rows&&act.rows){
      var ma={}; vs[0].rows.forEach(function(r){ ma[r.code]=r; }); var dsc={}; d.jobs.forEach(function(j){ dsc[j.code]=j.description; });
      var rows=act.rows.filter(function(r){ return ma[r.code]&&dd(ma[r.code].finish,r.finish)!==0; });
      if(rows.length) h+='<div class="card"><h3 style="margin-top:0">Plan '+esc(act.plan)+' against master Plan A ('+rows.length+' activities changed)</h3><div class="scroll"><table><tr><th>No.</th><th>Work</th><th>Plan A finish</th><th>Plan '+esc(act.plan)+' finish</th><th>Difference</th></tr>'+
        rows.map(function(r){ var df=dd(ma[r.code].finish,r.finish); return '<tr><td>'+esc(r.code)+'</td><td>'+esc(dsc[r.code]||'')+'</td><td>'+dshow(ma[r.code].finish)+'</td><td>'+dshow(r.finish)+'</td><td style="color:'+(df>0?'var(--red)':'var(--green)')+'"><b>'+(df>0?'+':'')+df+' days</b></td></tr>'; }).join('')+'</table></div></div>';
    }
  }
  pend.forEach(function(p){
    h+='<div class="card" style="border-left:5px solid var(--amber)"><b>Revised bar chart waiting for approval</b> <span class="muted">- proposed by '+esc(p.by)+' on '+esc(String(p.at).slice(0,16))+'</span>'+
      '<div style="margin-top:6px">Plan length: <b>'+esc(p.planDays)+' days</b> (limit '+esc(p.target)+')'+(p.beyond?' - <b style="color:var(--red)">beyond the scheduled completion</b>':'')+'</div><div class="muted" style="margin-top:4px">Changes: '+esc(p.summary)+'</div><div style="margin-top:4px">Reason: '+esc(p.reason)+'</div>'+
      (isOff?'<div style="margin-top:8px"><button class="btn small" onclick="reviewPlan(\''+esc(p.id)+'\',\'approve\')">Approve'+(locked?' as Plan '+next:'')+'</button> <button class="btn small sec" onclick="reviewPlan(\''+esc(p.id)+'\',\'reject\')">Reject</button></div>':'<div class="muted" style="margin-top:6px">Waiting for IOCL officer / admin.</div>')+'</div>';
  });
  if(isCon){ return h||'<div class="card muted">The bar chart has not been finalised yet.</div>'; }
  var mode=isTpi?'propose':(isOff&&locked?'revise':(isOff?'draft':'view'));
  h+='<div class="card"><h3 style="margin-top:0">'+(mode==='revise'?'Revise the plan - new Plan '+next:mode==='propose'?'Propose a revised plan':'Plan (bar chart)')+' - '+(locked?'<span style="color:var(--green)">LOCKED</span>':'<span style="color:var(--amber)">NOT LOCKED</span>')+'</h3>';
  if(mode==='view'||(mode==='draft'&&false)){ h+='<div class="muted">No access.</div>'; }
  else {
    h+='<div class="muted">Contract period: <b>'+lim.contract+' days</b> (scheduled completion '+dshow(s['Contract End'])+'). The IOCL plan is made for <b>'+lim.min+' days</b>; after discussion the contractor may be given up to '+lim.contract+' days. '+
      'Change the days of any activity - all following activities move automatically. "Clashes with": put Work Nos. that hinder this work at site (e.g. excavated earth); you get a warning if they run together. Activities already finished cannot be changed.'+
      (mode==='propose'?' <b>Your revised plan goes to the IOCL officer / admin for approval. The running plan changes only after they approve.</b>':'')+
      (mode==='revise'?' <b>When you save, the old plan is kept as history, Plan '+next+' becomes the running plan and the contractor is informed at once (e-mail), with a WhatsApp text ready.</b>':'')+'</div>';
    if(mode!=='draft'){
      h+='<div class="row" style="margin-top:8px;align-items:flex-end"><div style="max-width:320px"><label>Plan completes</label><select id="pbs" onchange="planBasis()"><option value="in">Within the scheduled completion (day '+lim.min+' to '+lim.contract+')</option><option value="out">BEYOND the scheduled completion (contractor commitment)</option></select></div>'+
        '<div id="pcw" style="display:none;max-width:220px"><label>Contractor commits to finish by</label><input id="pcd" type="date" min="'+esc(s['Contract End'])+'" onchange="planSoon()"></div></div>';
    }
    h+='<div class="row" style="margin:10px 0;align-items:flex-end"><div id="ptw" style="max-width:200px"><label>Bar chart limit (days, '+lim.min+' to '+lim.contract+')</label><input id="ptar" type="number" min="'+lim.min+'" max="'+lim.contract+'" value="'+(act&&act.limit&&+act.limit<=lim.contract?act.limit:lim.target)+'" oninput="planSoon()"></div>'+
      '<div style="flex:2"><div id="pst" class="muted">Checking...</div></div></div><div id="pcl"></div>'+
      '<div class="scroll"><table id="pt"><tr><th>No.</th><th>Work</th><th>Days</th><th>Starts after</th><th>Needed by day</th><th>Share %</th><th>Clashes with</th><th>Plan</th></tr>'+
      d.jobs.map(function(j){ var dis=j.actualFinish?' disabled title="Finished - cannot change"':''; return '<tr data-c="'+esc(j.code)+'"><td>'+esc(j.code)+'</td><td>'+esc(j.description)+'</td><td><input style="width:60px" data-k="days" type="number" min="0" value="'+j.days+'" oninput="planSoon()"'+dis+'></td><td><input style="width:120px" data-k="after" value="'+esc(j.after||'')+'" oninput="planSoon()"'+dis+'></td><td><input style="width:60px" data-k="neededBy" value="'+esc(j.neededBy===undefined?'':j.neededBy)+'" oninput="planSoon()"'+dis+'></td><td><input style="width:60px" data-k="share" type="number" step="0.01" value="'+j.share+'"'+dis+'></td><td><input style="width:90px" data-k="clash" value="'+esc(j.clash||'')+'" oninput="planSoon()"'+dis+'></td><td class="muted pl" data-p="'+esc(j.code)+'">'+dshow(j.planStart)+' - '+dshow(j.planFinish)+'</td></tr>'; }).join('')+
      '</table></div><label>'+(mode==='draft'?'Reason for change (agreed with contractor)':'Reason / contractor\'s commitment (what was agreed in the joint discussion)')+'</label><input id="prs" placeholder="e.g. slab 3 days more, plaster 3 days less - agreed on joint meeting"><div id="pe" class="err"></div>'+
      '<div class="row" style="margin-top:10px"><button class="btn sec" onclick="planPreview(true)">Auto-fit to limit</button>'+
      (mode==='propose'?'<button class="btn" onclick="proposePlan()">Send revised plan for approval</button>':mode==='revise'?'<button class="btn" onclick="revisePlan()">Adopt as Plan '+next+' and inform contractor</button>':'<button class="btn" onclick="savePlan()">Save plan changes</button><button class="btn" onclick="lockPlan(true)">Approve &amp; lock plan (Plan A)</button>')+
      ((mode==='revise'&&!(act&&act.beyond))?'<button class="btn sec" onclick="lockPlan(false)">Unlock plan (to correct a mistake)</button>':'')+'</div>'+
      (mode==='draft'?'<div class="muted" style="margin-top:6px">After the plan is approved and locked it becomes the master Plan A, the contractor is informed at once, and reminders start.</div>':'');
    setTimeout(function(){ if($('pt')) planPreview(false); },60);
  }
  h+='</div>';
  if(hist.length){ h+='<div class="card"><h3 style="margin-top:0">Earlier proposals</h3>'+hist.map(function(p){ return '<div class="muted" style="margin-bottom:6px"><b>'+esc(p.status)+'</b> - proposed by '+esc(p.by)+(p.reviewedBy?', decided by '+esc(p.reviewedBy):'')+'<br>'+esc(p.summary)+(p.remark?'<br>Remark: '+esc(p.remark):'')+'</div>'; }).join('')+'</div>'; }
  return h;
}
function planTarget(){
  var s=ST.site.site, b=$('pbs'), beyond=!!(b&&b.value==='out');
  if(beyond){ var dv=$('pcd').value; if(!dv) throw new Error('Select the date by which the contractor commits to finish.'); return {days:dd(s['Start Date'],dv)+1, beyond:true}; }
  return {days:+$('ptar').value, beyond:false};
}
function planBasis(){ var o=$('pbs').value==='out'; $('pcw').style.display=o?'':'none'; $('ptw').style.display=o?'none':''; planSoon(); }
function waPlan(){ var a=(ST.site.planVersions||[]).filter(function(v){ return v.status==='Active'; })[0]; if(a&&a.wa) window.open('https://wa.me/?text='+encodeURIComponent(a.wa),'_blank'); }
function waPlanCopy(){ var a=(ST.site.planVersions||[]).filter(function(v){ return v.status==='Active'; })[0]; if(!a) return; if(navigator.clipboard) navigator.clipboard.writeText(a.wa).then(function(){ toast('Copied'); },function(){ modal('<div class="pre">'+esc(a.wa)+'</div>'); }); else modal('<div class="pre">'+esc(a.wa)+'</div>'); }
function ackPlan(vid){
  modal('<h2>Acknowledge this plan</h2><div class="muted">This records that the contractor has seen and accepts the plan. (If not acknowledged, the plan still stands as prepared after discussion.)</div><label>Remark (optional)</label><textarea id="akr" rows="3"></textarea><div id="ake" class="err"></div><div class="row" style="margin-top:12px"><button class="btn" id="akb">Acknowledge</button><button class="btn sec" onclick="closeModal()">Cancel</button></div>');
  $('akb').onclick=function(){ api('apiAckPlan',ST.token,ST.siteId,vid,$('akr').value).then(function(d){ closeModal(); refreshSite(d); toast('Acknowledged'); }).catch(function(e){ showErr('ake',e); }); };
}
function proposePlan(){ var t; try{ t=planTarget(); }catch(e){ return showErr('pe',e); }
  api('apiProposePlan',ST.token,ST.siteId,planRows(),t.days,$('prs').value,t.beyond).then(function(d){ refreshSite(d); toast('Revised plan sent for approval'); }).catch(function(e){ showErr('pe',e); }); }
function revisePlan(){ var t; try{ t=planTarget(); }catch(e){ return showErr('pe',e); }
  api('apiRevisePlan',ST.token,ST.siteId,planRows(),t.days,$('prs').value,t.beyond).then(function(d){ refreshSite(d); toast('New plan adopted. Contractor informed.'); }).catch(function(e){ showErr('pe',e); }); }
function reviewPlan(pid,action){
  modal('<h2>'+(action==='approve'?'Approve this revised bar chart?':'Reject this revised bar chart')+'</h2><div class="muted">'+(action==='approve'?'It becomes the running plan, all planned dates change and the contractor is informed at once.':'The running plan stays as it is.')+'</div><label>Remark'+(action==='reject'?' (reason is required)':' (optional)')+'</label><textarea id="rpr" rows="3"></textarea><div id="rpe" class="err"></div><div class="row" style="margin-top:12px"><button class="btn" id="rpb">'+(action==='approve'?'Approve and apply':'Reject')+'</button><button class="btn sec" onclick="closeModal()">Cancel</button></div>');
  $('rpb').onclick=function(){ api('apiReviewPlan',ST.token,ST.siteId,pid,action,$('rpr').value).then(function(d){ closeModal(); refreshSite(d); toast(action==='approve'?'Plan updated':'Proposal rejected'); }).catch(function(e){ showErr('rpe',e); }); };
}
var PLT=null;
function planRows(){ var rows=[]; document.querySelectorAll('#pt tr[data-c]').forEach(function(tr){ var o={code:tr.getAttribute('data-c')}; tr.querySelectorAll('[data-k]').forEach(function(i){ o[i.getAttribute('data-k')]=i.value; }); rows.push(o); }); return rows; }
function planSoon(){ clearTimeout(PLT); PLT=setTimeout(function(){ planPreview(false); },600); }
function planPreview(auto){
  if(!$('pt')) return; var t;
  try{ t=planTarget(); }catch(e){ $('pst').innerHTML='<span class="muted">'+esc(e.message)+'</span>'; return; }
  api('apiPlanPreview',ST.token,ST.siteId,planRows(),t.days,!!auto,t.beyond).then(function(p){
    if(auto){ p.rows.forEach(function(r){ var tr=document.querySelector('#pt tr[data-c="'+r.code+'"]'); if(tr) tr.querySelector('[data-k="days"]').value=r.days; }); }
    p.rows.forEach(function(r){ var td=document.querySelector('#pt td[data-p="'+r.code+'"]'); if(td){ td.textContent=dshow(r.planStart)+' - '+dshow(r.planFinish); td.style.fontWeight=r.critical?'bold':''; td.style.color=r.critical?'var(--red)':''; } });
    var msg=p.over>0?'<span style="color:var(--red)"><b>Bar chart is '+p.planDays+' days - '+p.over+' day(s) more than the limit of '+p.target+'.</b> Shorten some activities or press Auto-fit.</span>':
      '<span style="color:var(--green)"><b>Bar chart is '+p.planDays+' days</b> - within the limit of '+p.target+' days ('+p.spareDays+' spare). Contract: '+p.contract+' days.</span>';
    if(auto&&!p.fitOk) msg='<span style="color:var(--red)"><b>Cannot shorten further automatically ('+p.planDays+' days). Please reduce some activities by hand or raise the limit.</b></span>';
    $('pst').innerHTML=msg+' <span class="muted">Red dates = critical (cannot slip).</span>';
    $('pcl').innerHTML=(p.clashes||[]).map(function(x){ return '<div class="card" style="border-left:5px solid var(--amber);padding:8px">Clash warning: '+esc(x)+'</div>'; }).join('')+(p.practical||[]).map(function(x){ return '<div class="card" style="border-left:5px solid var(--amber);padding:8px">Practical check: '+esc(x)+'</div>'; }).join('');
    $('pe').textContent='';
  }).catch(function(e){ $('pst').innerHTML='<span style="color:var(--red)">'+esc(e.message||e)+'</span>'; });
}
function savePlan(){
  api('apiEditPlan',ST.token,ST.siteId,planRows(),$('ptar').value,$('prs').value).then(function(d){ refreshSite(d); toast('Plan saved. Plan finish: '+dshow(d.site['Plan Finish'])); }).catch(function(e){ showErr('pe',e); });
}
function lockPlan(on){
  var reason=''; if(!on){ reason=prompt('Reason for unlocking the plan:'); if(!reason) return; } else if(!confirm('Approve and lock this plan? Planned dates will not change after this.')) return;
  api('apiLock',ST.token,ST.siteId,on,reason).then(function(d){ refreshSite(d); toast(on?'Plan locked':'Plan unlocked'); }).catch(function(e){ toast(e.message); });
}
function saveExtra(){ api('apiExtraDays',ST.token,ST.siteId,v('xd'),v('xr')).then(function(d){ refreshSite(d); toast('Extension saved'); }).catch(function(e){ showErr('xe',e); }); }
function setStatus(x){ api('apiSetStatus',ST.token,ST.siteId,x).then(function(){ openSite(ST.siteId); }).catch(function(e){ toast(e.message); }); }

/* ============ users (admin) ============ */
function usersView(){
  api('apiUsers',ST.token).then(function(us){
    var h='<div class="card"><div class="row" style="align-items:center"><h3 style="margin:0">Users</h3><div style="text-align:right"><button class="btn" onclick="editUser(null)">+ Add user</button></div></div>'+
      '<div class="muted" style="margin-top:6px">ADMIN = everything incl. approvals · OFFICER = Site Engineer / Engineer-in-Charge / SREH / SRH - sees sites, edits details, sends reminders · TPI = updates progress, dates, delay reasons, photos, hindrances · CONTRACTOR = can only see own site.<br>Sites: "ALL" or Site IDs like S001, S004. A user named as TPI / Engineer-in-Charge / Officer e-mail in a site sees that site anyway.</div>'+
      '<div class="scroll" style="margin-top:8px"><table><tr><th>Name</th><th>E-mail</th><th>Role</th><th>Designation</th><th>Sites</th><th>Active</th><th></th></tr>'+
      us.map(function(u,i){ return '<tr><td>'+esc(u.name)+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.role)+'</td><td>'+esc(u.designation)+'</td><td>'+esc(u.sites)+'</td><td>'+esc(u.active)+'</td><td><button class="btn small sec" onclick=\'editUser('+JSON.stringify(u).replace(/'/g,"&#39;")+')\'>Edit</button> <button class="btn small sec" onclick="resetPin(\''+esc(u.email)+'\')">New PIN</button></td></tr>'; }).join('')+'</table></div></div>';
    shell('Users','RO-PACE admin',h,'home()');
  }).catch(function(e){ toast(e.message); });
}
function editUser(u){
  u=u||{}; var L=ST.boot.lists||{};
  modal('<h2>'+(u.email?'Edit user':'Add user')+'</h2><label>E-mail</label><input id="ue" value="'+esc(u.email||'')+'"'+(u.email?' disabled':'')+'><label>Name</label><input id="un" value="'+esc(u.name||'')+'">'+
   '<label>Role</label><select id="ur">'+['TPI','OFFICER','ADMIN','CONTRACTOR'].map(function(r){ return '<option'+(r===u.role?' selected':'')+'>'+r+'</option>'; }).join('')+'</select>'+
   '<label>Designation</label><select id="ud"><option></option>'+(L['Designation']||[]).map(function(r){ return '<option'+(r===u.designation?' selected':'')+'>'+esc(r)+'</option>'; }).join('')+'</select>'+
   '<label>Sites (ALL, or Site IDs separated by comma)</label><input id="us" value="'+esc(u.sites||'')+'"><label>Mobile</label><input id="um" value="'+esc(u.mobile||'')+'">'+
   '<label>Active</label><select id="ua"><option'+(u.active==='NO'?'':' selected')+'>YES</option><option'+(u.active==='NO'?' selected':'')+'>NO</option></select>'+
   '<div id="ux" class="err"></div><div class="row" style="margin-top:12px"><button class="btn" onclick="saveUser()">Save</button><button class="btn sec" onclick="closeModal()">Cancel</button></div>');
}
function saveUser(){
  api('apiSaveUser',ST.token,{email:v('ue'),name:v('un'),role:v('ur'),designation:v('ud'),sites:v('us'),mobile:v('um'),active:v('ua')}).then(function(r){
    closeModal(); if(r&&r.pin) alert('User added. PIN: '+r.pin+'\n(It has also been e-mailed to the user.)'); usersView(); }).catch(function(e){ showErr('ux',e); });
}
function resetPin(email){ if(!confirm('Make a new PIN for '+email+'?')) return; api('apiResetPin',ST.token,email).then(function(r){ alert('New PIN for '+email+': '+r.pin+'\n(Also e-mailed.)'); }).catch(function(e){ toast(e.message); }); }

/* ============ start ============ */
if(ST.token) home(); else viewLogin();
</script>
</body>
</html>
